# Compila ClipLite (Windows y Android) en los servidores de GitHub y publica una versión nueva
# (Releases). Las apps instaladas la detectan, la descargan, comprueban su huella SHA-256 y se actualizan.
name: Compilar ClipLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Número de versión: 1.0.<número de compilación>. Va dentro del programa.
  CLIPLITE_VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Empaquetar con FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force dist, publicar | Out-Null
          Copy-Item target/release/ClipLite.exe dist/
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName dist/
          Copy-Item LEEME.md dist/
          Compress-Archive -Path dist/* -DestinationPath publicar/ClipLite-Windows.zip
          Copy-Item target/release/ClipLite.exe publicar/

      - uses: actions/upload-artifact@v4
        with:
          name: ClipLite-Windows
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: publicar-windows
          path: publicar

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Clave de firma
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          # La clave oficial vive en un secreto del repositorio (Settings > Secrets > Actions).
          # Sin ella se compila igualmente para comprobar que todo funciona, pero el APK no se publica:
          # Android solo acepta actualizaciones firmadas siempre con la misma clave.
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > android/clave.jks
            echo "FIRMA=oficial" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore android/clave.jks -storetype PKCS12 -alias cliplite -keyalg RSA -keysize 2048 \
              -validity 30 -storepass cliplite-android -keypass cliplite-android -dname "CN=ClipLite prueba"
            echo "FIRMA=temporal" >> "$GITHUB_ENV"
            echo "::warning::Falta el secreto ANDROID_KEYSTORE: el APK se compila pero no se publica."
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PversionName="$CLIPLITE_VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p ../dist-android ../publicar
          cp app/build/outputs/apk/release/app-release.apk ../dist-android/ClipLite-Android.apk
          if [ "$FIRMA" = "oficial" ]; then cp ../dist-android/ClipLite-Android.apk ../publicar/; fi
          ls -la ../dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: ClipLite-Android
          path: dist-android

      - uses: actions/upload-artifact@v4
        if: env.FIRMA == 'oficial'
        with:
          name: publicar-android
          path: publicar

  # Prueba real en un emulador Android (no bloquea la publicación).
  android-prueba:
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ClipLite-Android
          path: apk
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ffmpeg
        run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Emulador y prueba
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/pruebas/emulador.sh apk/ClipLite-Android.apk
      - name: Analizar vídeos
        if: always()
        run: |
          cd resultado || exit 0
          for f in *.mp4; do
            [ -f "$f" ] || continue
            echo "== $f ($(stat -c %s "$f") bytes)"
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,duration -show_entries format=duration -of compact "$f"
            ffmpeg -v error -i "$f" -f null - && echo "   decodifica sin errores"
            ffmpeg -v error -y -ss 1 -i "$f" -frames:v 1 -vf scale=480:-1 "fotograma_${f%.mp4}.png"
          done
      - name: Guardar capturas en la rama pruebas-android
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd resultado || exit 0
          rm -f *.mp4
          for p in *.png; do [ -f "$p" ] && ffmpeg -v error -y -i "$p" -vf "scale='min(540,iw)':-1" "small_$p" && mv "small_$p" "$p"; done
          git init -q . && git checkout -q -b pruebas-android
          git -c user.name="ClipLite CI" -c user.email="ci@invalid" add -A
          git -c user.name="ClipLite CI" -c user.email="ci@invalid" commit -q -m "Prueba en emulador ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" pruebas-android

  publicar:
    needs: [windows, android]
    # Si la app Android fallara, la versión de PC se publica igualmente.
    if: always() && github.ref == 'refs/heads/main' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: publicar-*
          path: publicar
          merge-multiple: true

      - name: Publicar versión
        env:
          GH_TOKEN: ${{ github.token }}
          MENSAJE: ${{ github.event.head_commit.message }}
        run: |
          # Notas: el mensaje del cambio, sin las líneas de autoría.
          printf '%s\n' "$MENSAJE" | grep -v -E '^(Co-Authored-By|Claude-Session):' > notas.md
          gh release create "v$CLIPLITE_VERSION" publicar/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ClipLite $CLIPLITE_VERSION" \
            --notes-file notas.md \
            --latest
