<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipLite</title>
<style>
:root{
  --bg:#0f1014; --panel:#16171d; --panel2:#1d1f27; --line:#2a2d38; --text:#e8e9ee; --dim:#9497a3; --faint:#5d606c;
  --accent:#e5393f; --accent2:#ff6a5c; --gold:#f2b134; --obj:#9b7bff; --ast:#4aa3ff; --death:#7c808c; --manual:#f2d24b;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
/* barra lateral */
.rail{background:#0b0c0f;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{width:36px;height:36px;margin-bottom:14px}
.rail button{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--faint);position:relative}
.rail button:hover{color:var(--text);background:var(--panel2)}
.rail button.on{color:var(--text);background:var(--panel2)}
.rail button.on::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.rail svg{width:22px;height:22px}
.tip{position:absolute;left:52px;white-space:nowrap;background:#000;padding:4px 8px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:.12s;z-index:5}
.rail button:hover .tip{opacity:1}
/* principal */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:14px 22px 10px}
.crumbs{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600}
.crumbs .sep{color:var(--faint);font-weight:400}
select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none}
select:focus,input:focus{border-color:var(--faint)}
.crumbs select{font-size:16px;font-weight:500}
header .grow{flex:1}
header input{width:220px}
/* tarjetas de sesiones */
.sessions{display:flex;gap:10px;overflow-x:auto;padding:4px 22px 14px;scrollbar-width:thin;flex:none}
.card{flex:none;width:230px;display:flex;gap:10px;align-items:center;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid transparent;text-align:left;transition:.12s}
.card:hover{background:var(--panel2)}
.card.on{background:var(--panel2);border-color:var(--line);box-shadow:inset 0 -2px 0 var(--accent)}
.badge{flex:none;width:52px;height:52px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff}
.card .t{font-weight:600;font-size:15px}
.card .s{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.card .k{font-size:12px;color:var(--text)}
.card .tro{margin-left:auto;align-self:flex-start;color:var(--gold);font-size:14px}
/* escenario */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);gap:0 18px;padding:0 22px 16px}
.left{display:flex;flex-direction:column;min-height:0;min-width:0}
.titlebar{display:flex;align-items:center;gap:10px;padding:2px 0 8px}
.titlebar h2{margin:0;font-size:17px;font-weight:600}
.titlebar .meta{color:var(--dim);font-size:13px}
.titlebar .grow{flex:1}
.chip{padding:6px 11px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--panel2)}
.chip.on{border-color:var(--accent);color:#fff}
.star{color:var(--faint);font-size:18px;line-height:1}
.star.on{color:var(--manual)}
.player{position:relative;flex:1;min-height:120px;background:#000;border-radius:var(--r);overflow:hidden}
video#v{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;outline:none}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--dim);padding:30px}
.msg.show{display:grid}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 12px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
/* línea de tiempo */
.tlwrap{padding:10px 4px 0;flex:none}
.tracks{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 4px 0;font-size:13px;color:var(--dim);flex:none}
.trk{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.trk:hover{background:var(--panel2)}
.trk .box{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:10px;line-height:1}
.trk.on .box{background:var(--accent);border-color:var(--accent);color:#fff}
.trk.off{color:var(--faint);text-decoration:line-through}
.trk:disabled{opacity:.5;cursor:default}
.tracks .note{font-size:12px;color:var(--faint)}
.tracks .grow{flex:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--faint);border-top-color:var(--text);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tlbar{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;padding-bottom:6px}
.tlbar .grow{flex:1}
.tlbar button{padding:4px 9px;border-radius:6px;color:var(--dim);font-size:12px}
.tlbar button:hover{background:var(--panel2);color:var(--text)}
.tlbar button.on{color:var(--text);background:var(--panel2)}
.timeline{position:relative;height:76px;cursor:pointer;user-select:none;flex:none}
.track{position:absolute;left:0;right:0;top:44px;height:6px;background:var(--panel2);border-radius:3px}
.band{position:absolute;top:44px;height:6px;background:rgba(229,57,63,.45);border-radius:3px}
.band.cur{background:var(--accent)}
.played{position:absolute;left:0;top:44px;height:6px;background:rgba(255,255,255,.18);border-radius:3px;pointer-events:none}
.mk{position:absolute;top:6px;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:13px;z-index:2;transition:transform .1s}
.mk:hover{transform:translateX(-50%) scale(1.18);z-index:3}
.mk::after{content:"";position:absolute;bottom:-12px;left:50%;width:1px;height:11px;background:var(--line)}
.mk .lbl{position:absolute;bottom:32px;white-space:nowrap;background:#000;padding:3px 7px;border-radius:5px;font-size:11px;opacity:0;pointer-events:none}
.mk:hover .lbl{opacity:1}
.head{position:absolute;top:36px;width:2px;height:22px;background:#fff;border-radius:1px;transform:translateX(-1px);pointer-events:none;z-index:4}
.hover{position:absolute;top:58px;transform:translateX(-50%);font-size:11px;color:var(--dim);pointer-events:none;display:none}
.ruler{position:absolute;left:0;right:0;top:56px;height:18px;font-size:11px;color:var(--faint);pointer-events:none}
.ruler span{position:absolute;transform:translateX(-50%)}
.ruler span::before{content:"";position:absolute;left:50%;top:-6px;width:1px;height:4px;background:var(--faint)}
/* clips */
.right{display:flex;flex-direction:column;min-height:0}
.right h3{margin:2px 0 10px;font-size:14px;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:8px}
.right h3 .grow{flex:1}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;scrollbar-width:thin}
.clip{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:6px;border-radius:var(--r);background:var(--panel);border:1px solid transparent;text-align:left;align-items:center}
.clip:hover{background:var(--panel2)}
.clip.on{border-color:var(--accent);background:var(--panel2)}
.thumb{position:relative;width:120px;height:68px;border-radius:6px;overflow:hidden;background:#000}
.thumb video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb .d{position:absolute;right:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.7);padding:0 4px;border-radius:3px}
.clip .n{font-weight:600;display:flex;align-items:center;gap:6px}
.clip .g{font-size:12px;color:var(--dim)}
.clip .star{margin-left:auto}
.clip .trash{color:var(--faint);font-size:14px;padding:0 2px;opacity:0;transition:.12s}
.clip:hover .trash{opacity:1}
.clip .trash:hover{color:var(--accent)}
.chip.danger:hover{border-color:var(--accent);color:#fff}
.space{padding:6px 22px 24px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-content:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.panel h3{margin:0 0 10px;font-size:15px}
.big{font-size:30px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border:0}
.panel p{color:var(--dim);font-size:13px;margin:8px 0}
/* editor */
.edname{width:320px}
.ed{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);gap:0 18px;padding:0 22px 14px}
.edleft{display:flex;flex-direction:column;min-height:0;min-width:0}
.edright{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.edstage{position:relative;flex:1;min-height:160px;background:#000;border-radius:var(--r);display:grid;place-items:center;overflow:hidden}
.edframe{position:relative;max-width:100%;max-height:100%;height:100%;overflow:hidden;background:#000;container-type:size}
.edframe video{position:absolute;inset:0;width:100%;height:100%}
.edbg{object-fit:cover;filter:blur(18px) brightness(.8);transform:scale(1.15)}
.edtext{position:absolute;left:4%;right:4%;text-align:center;color:#fff;font-weight:800;-webkit-text-stroke:0;text-shadow:0 0 4px #000,0 0 4px #000,2px 2px 3px #000;white-space:nowrap;overflow:hidden;pointer-events:none;font-family:Arial,"Segoe UI",sans-serif}
.edtext.top{top:7%}.edtext.center{top:50%;transform:translateY(-50%)}.edtext.bottom{bottom:14%}
.edempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}
.edtrans{display:flex;align-items:center;gap:10px;padding:10px 2px 6px;font-size:13px;color:var(--dim);flex:none}
.edtime{font-variant-numeric:tabular-nums;color:var(--text)}
.note{font-size:12px;color:var(--faint)}
.edtl{position:relative;display:flex;gap:3px;height:52px;flex:none;background:var(--panel);border-radius:8px;padding:4px}
.edseg{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;text-align:left}
.edseg .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.edseg .dd{font-size:11px;color:var(--dim);white-space:nowrap}
.edseg.on{border-color:var(--accent);background:#2a1d22}
.edhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;left:0}
.edpanel{flex:none;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.edrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.edrow b{color:var(--text)}
.edrow .g{font-variant-numeric:tabular-nums}
.edrange{position:relative;height:30px;background:var(--panel2);border-radius:6px;cursor:pointer;touch-action:none}
.edsel{position:absolute;top:0;bottom:0;background:rgba(229,57,63,.35);border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.edh{position:absolute;top:-3px;bottom:-3px;width:12px;margin-left:-6px;background:var(--accent);border-radius:4px;cursor:ew-resize;z-index:2}
.edh::after{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:2px;background:#fff8}
.edsrchead{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;pointer-events:none;z-index:3}
.edtxt{flex:1;min-width:180px}
.edsrc{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:220px;overflow-y:auto}
.edsrcrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--panel2);text-align:left}
.edsrcrow:hover{outline:1px solid var(--line)}
.edsrcrow span:first-child{flex:1}
.edsrcrow .g{color:var(--dim);font-size:12px}
.edsrcrow b{color:var(--accent)}
.edlbl{font-size:12px;color:var(--dim);margin:10px 0 6px}
.edchips{display:flex;flex-wrap:wrap;gap:6px}
.chip.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:8px;width:100%;justify-content:center;padding:9px}
.chip.primary:hover{background:var(--accent2)}
.chip:disabled{opacity:.45;cursor:default}
.panel .ok{color:#6fd08c}.panel .err{color:var(--accent2)}
.panel select{width:100%}
.panel .edrow select{width:auto}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--dim);padding:40px}
.empty h2{color:var(--text);margin:0 0 8px}
kbd{font:11px "Segoe UI";background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.keys{color:var(--faint);font-size:12px;margin-top:10px;line-height:1.9}
@media (max-width:1000px){.stage{grid-template-columns:1fr}.right{max-height:220px}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <svg class="logo" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#e5393f" stroke-width="3"/><circle cx="18" cy="18" r="7" fill="#e5393f"/></svg>
    <button id="navAll" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg><span class="tip">Sesiones</span></button>
    <button id="navEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6 20 18M8.6 16.4 20 6"/></svg><span class="tip">Editor</span></button>
    <button id="navSpace"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3H4zm0 5h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zm5 3v2h6v-2z"/></svg><span class="tip">Espacio y limpieza</span></button>
    <button id="navFav"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3L2.8 9.5l6.4-.9z"/></svg><span class="tip">Favoritos</span></button>
  </nav>
  <div class="main" id="main"></div>
</div>

<script>
const DATA = __CLIPLITE_DATA__;

// ------------------------------------------------------------- utilidades
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const src = rel => rel.split("/").map(encodeURIComponent).join("/");
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const hh = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return hh ? `${hh}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
};
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate = d => {
  const m = /^(\d+)-(\d+)-(\d+)_(\d+)-(\d+)/.exec(d || "");
  return m ? `${+m[3]} ${MESES[m[2] - 1]} ${m[1]}, ${m[4]}:${m[5]}` : d;
};
const hue = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x % 360; };
const initials = g => { const w = g.split(/[\s-]+/).filter(x => x.length > 2 || /\d/.test(x)); return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || g).slice(0, 2)).toUpperCase(); };

const EV = {
  kill: ["Kill", "⚔", "kill"], "2k": ["Doble kill", "⚔", "multi"], "3k": ["Triple kill", "🔥", "multi"],
  "4k": ["4 kills", "🔥", "multi"], ace: ["Ace", "👑", "multi"], doublekill: ["Doble kill", "⚔", "multi"],
  triplekill: ["Triple kill", "🔥", "multi"], quadrakill: ["Cuádruple kill", "🔥", "multi"],
  pentakill: ["PENTAKILL", "👑", "multi"], primera_sangre: ["Primera sangre", "🩸", "kill"],
  muerte: ["Muerte", "☠", "death"], asistencia: ["Asistencia", "🤝", "ast"], dragon: ["Dragón", "🐉", "obj"],
  baron: ["Barón", "🟣", "obj"], heraldo: ["Heraldo", "🟪", "obj"], larvas: ["Larvas", "🐛", "obj"],
  atakhan: ["Atakhan", "🟥", "obj"], torre: ["Torre", "🏰", "obj"], inhibidor: ["Inhibidor", "💠", "obj"],
  manual: ["Clip manual", "★", "manual"],
  editado: ["Editado", "✂", "manual"],
};
const COLORS = { kill: "var(--accent)", multi: "var(--gold)", death: "var(--death)", ast: "var(--ast)", obj: "var(--obj)", manual: "var(--manual)" };
const ev = l => EV[l] || [l.replace(/_/g, " "), "•", "kill"];
const isKill = (l, game) => ["kill", "2k", "3k", "4k"].includes(l) || (l === "ace" && !/league/i.test(game));

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("cliplite.fav") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("cliplite.fav", JSON.stringify([...favs])); } catch (e) {} };

// número de partida por juego (en orden cronológico)
const sessions = DATA.slice().sort((a, b) => a.date.localeCompare(b.date));
const counter = {};
for (const s of sessions) { counter[s.game] = (counter[s.game] || 0) + 1; s.n = counter[s.game]; s.kills = s.events.filter(e => isKill(e.label, s.game)).length; }
sessions.reverse();
const games = [...new Set(sessions.map(s => s.game))];

// ------------------------------------------------------------- estado
const st = { view: "all", game: "", q: "", sel: null, playing: null /* null = partida; objeto clip */, muted: new Set(), busy: false };
// Con ClipLite abierto el reproductor se sirve desde 127.0.0.1 y puede mezclar pistas de audio.
const API = location.protocol.startsWith("http") ? new URLSearchParams(location.search).get("t") : null;
const tracksOf = s => (s && s.tracks && s.tracks.length) ? s.tracks : ["Todo"];
const TRACK_ICON = n => /juego/i.test(n) ? "🎮" : /discord|teamspeak|skype|teams/i.test(n) ? "💬" : /micr/i.test(n) ? "🎙" : /spotify|music|música/i.test(n) ? "🎵" : "🔊";
const api = (what, params) => fetch(`/api/${what}?t=${API}&` + new URLSearchParams(params)).then(r => r.json());
let video, tl;

function filtered() {
  const q = st.q.toLowerCase();
  return sessions.filter(s => (!st.game || s.game === st.game) &&
    (!q || s.game.toLowerCase().includes(q) || fdate(s.date).toLowerCase().includes(q) ||
      s.clips.some(c => ev(c.label)[0].toLowerCase().includes(q))));
}

// ------------------------------------------------------------- interfaz
function render() {
  const main = $("#main");
  main.innerHTML = "";
  $("#navAll").classList.toggle("on", st.view === "all");
  $("#navFav").classList.toggle("on", st.view === "fav");
  $("#navSpace").classList.toggle("on", st.view === "space");
  $("#navEdit").classList.toggle("on", st.view === "edit");
  if (st.view !== "edit" && edv) { edPause(); edv = null; }
  if (st.view === "space") return renderSpace(main);
  if (st.view === "edit") return renderEditor(main);

  if (!sessions.length) {
    main.append(h("div", { class: "empty" }, h("div", {},
      h("h2", {}, "Aún no hay partidas"),
      h("div", {}, "Abre un juego: ClipLite empezará a grabar solo y aquí aparecerán tus partidas y clips."))));
    return;
  }

  const header = h("header", {},
    h("div", { class: "crumbs" },
      h("span", {}, st.view === "fav" ? "Favoritos" : "Sesiones"), h("span", { class: "sep" }, "›"),
      h("select", { onchange: e => { st.game = e.target.value; pickFirst(); render(); } },

// ------------------------------------------------------------- borrar y espacio
const sizeOf = s => (s.match_size || 0) + s.clips.reduce((a, c) => a + (c.size || 0), 0);
const human = b => b >= 1e9 ? (b / 1e9).toFixed(1).replace(".", ",") + " GB" : Math.round(b / 1e6) + " MB";
const ageDays = s => {
  const m = /^(\d+)-(\d+)-(\d+)/.exec(s.date || "");
  if (!m) return 0;
  const d = Date.UTC(+m[1], m[2] - 1, +m[3]);
  const n = new Date();
  return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - d) / 864e5);
};
/** Lo que se borraría de una sesión (todo salvo clips favoritos). */
const deletable = s => (s.match ? s.match_size || 0 : 0) + s.clips.filter(c => !favs.has(c.file)).reduce((a, c) => a + (c.size || 0), 0);

function stopVideo() { if (video) { video.pause(); video.removeAttribute("src"); video.load(); } }
function reloadTo(hash) { setTimeout(() => { location.hash = hash; location.reload(); }, 900); }

async function deleteClip(c) {
  const [name] = ev(c.label);
  if (!confirm(`¿Borrar el clip "${name}"?\n\nIrá a la Papelera de reciclaje de Windows.`)) return;
  if (st.playing === c) stopVideo();
  try {
    const r = await api("delete", { file: c.file });
    if (r.error) throw new Error(r.error);
    toast("Clip enviado a la Papelera");
    reloadTo("#s=" + encodeURIComponent(st.sel.id));
  } catch (e) { toast("No se pudo borrar"); }
}

async function deleteSession() {
  const s = st.sel;

  const what = [s.match ? "la partida completa" : null, `${s.clips.length - favCount} clip${s.clips.length - favCount === 1 ? "" : "s"}`].filter(Boolean).join(" y ");
  const keep = favCount ? `\nSe conservarán ${favCount} clip${favCount === 1 ? "" : "s"} favorito${favCount === 1 ? "" : "s"}.` : "";
  if (!confirm(`¿Borrar ${what} de esta partida (${human(deletable(s))})?${keep}\n\nIrá a la Papelera de reciclaje de Windows.`)) return;
  stopVideo();
  try {
    const r = await api("delete_session", { id: s.id });
    if (r.error) throw new Error(r.error);

    reloadTo("");
  } catch (e) { toast("No se pudo borrar"); }
}

// ------------------------------------------------------------- reproducción
function select(s) {
  if (s !== st.sel) st.muted = new Set();
  st.sel = s;
  try { history.replaceState(null, "", "#s=" + encodeURIComponent(s.id)); } catch (e) {}
  render();
}
function pickFirst() { const f = filtered(); if (!f.includes(st.sel)) st.sel = f[0] || null; }

let loadSeq = 0;
/** Carga un vídeo (original o con las pistas silenciadas) en el instante `at`. */
async function load(rel, at, autoplay) {
  const seq = ++loadSeq;
  let want = src(rel);
  if (st.muted.size && API) {
    st.busy = true; renderTracks();
    try {
      const r = await api("mix", { file: rel, keep: keepList().join(",") });
      if (r.error) throw new Error(r.error);
      want = r.url;
    } catch (e) {
      toast("No se pudo preparar el audio");
    }
    st.busy = false;
    if (seq !== loadSeq) return; // llegó otra petición mientras tanto
    renderTracks();
  }
  if (video.getAttribute("src") !== want) {
    video.setAttribute("src", want);
    video.addEventListener("loadedmetadata", () => { video.currentTime = at || 0; if (autoplay !== false) video.play().catch(() => {}); }, { once: true });
  } else {
    video.currentTime = at || 0;
    if (autoplay !== false) video.play().catch(() => {});
  }
}

function playMatch(t, autoplay) {
  const s = st.sel;
  st.playing = null;
  load(s.match, Math.max(0, t || 0), autoplay);
  setTitle("Partida completa", `${s.game} · ${fdate(s.date)} · ${fmt(s.duration)}`);
  markActive();
}

function playClip(c, offset, autoplay) {
  const s = st.sel;
  st.playing = c;
  load(c.file, offset || 0, autoplay);
  const [name] = ev(c.label);
  setTitle(name, `${s.game} · ${fdate(s.date)}${s.match && !c.edited ? " · minuto " + fmt(c.t) : ""} · ${fmt(c.dur)}`);
  markActive();
}

function nextClip(dir, auto) {
  const cl = st.sel.clips, i = cl.indexOf(st.playing);
  const n = cl[i + dir];
  if (n) playClip(n);
  else if (auto) toast("Fin de los clips");
}

function setTitle(t, m) { $("#title").textContent = t; $("#meta").textContent = m; }

function markActive() {
  document.querySelectorAll(".clip").forEach(b => b.classList.toggle("on", !!st.playing && b.dataset.file === st.playing.file));
  const fb = $("#fullBtn"); if (fb) fb.classList.toggle("on", !st.playing);
  tl && tl.querySelectorAll(".band").forEach(b => b.classList.toggle("cur", !!st.playing && b.dataset.file === st.playing.file));
}

/** Posición actual en la escala de la sesión. */
function sessionTime() {
  if (!video) return 0;
  return st.playing ? st.playing.t + video.currentTime : video.currentTime;
}
function total() {
  const s = st.sel;
  if (!st.playing && video && isFinite(video.duration) && video.duration > 0) return video.duration;
  return Math.max(s.duration || 0, ...s.clips.map(c => c.t + c.dur), ...s.events.map(e => e.t + 1), 1);
}

/** Ir a un punto de la sesión: en la partida si existe, o en el clip que lo contiene. */
function seekSession(t) {
  const s = st.sel;
  if (s.match) return playMatch(t);
  const c = s.clips.find(c => !c.edited && t >= c.t - 0.5 && t <= c.t + c.dur + 0.5);
  if (c) playClip(c, Math.max(0, t - c.t));
  else toast("Ese momento no se guardó en clip");
}

function jumpEvent(dir) {
  const s = st.sel, now = sessionTime();
  const evs = s.events.map(e => e.t).sort((a, b) => a - b);
  const target = dir > 0 ? evs.find(t => t - 3 > now + 0.5) : evs.reverse().find(t => t - 3 < now - 1.5);
  if (target == null) return toast(dir > 0 ? "No hay más momentos" : "Es el primer momento");
  seekSession(Math.max(0, target - 3));
}

function setRate(r) {
  video.playbackRate = r;
  document.querySelectorAll(".tlbar [data-r]").forEach(b => b.classList.toggle("on", +b.dataset.r === r));
  toast("Velocidad " + r + "×");
}

// ------------------------------------------------------------- línea de tiempo
function buildTimeline() {
  const s = st.sel, T = total();
  tl.innerHTML = "";
  tl.append(h("div", { class: "track" }));
  for (const c of s.clips.filter(c => !c.edited)) {
    tl.append(h("div", { class: "band", "data-file": c.file, title: ev(c.label)[0], style: `left:${c.t / T * 100}%;width:${Math.max(0.4, c.dur / T * 100)}%` }));
  }
  tl.append(h("div", { class: "played", id: "played" }));
  // marcadores (los muy juntos se agrupan para que no se tapen)
  const evs = s.events.slice().sort((a, b) => a.t - b.t);
  const minGap = T * 0.012;
  const groups = [];
  for (const e of evs) {
    const g = groups[groups.length - 1];
    if (g && e.t - g.at <= minGap) g.items.push(e); else groups.push({ at: e.t, items: [e] });
  }
  const rank = { multi: 5, kill: 4, obj: 3, manual: 2, ast: 1, death: 0 };
  for (const g of groups) {
    const top = g.items.slice().sort((a, b) => rank[ev(b.label)[2]] - rank[ev(a.label)[2]])[0];
    const [name, icon, cat] = ev(top.label);
    const label = g.items.map(e => ev(e.label)[0]).join(" + ") + " · " + fmt(g.at);
    tl.append(h("button", {
      class: "mk", style: `left:${g.at / T * 100}%;color:${COLORS[cat]};border-color:${COLORS[cat]}`,
      onclick: e => { e.stopPropagation(); seekSession(Math.max(0, g.at - 3)); },
    }, icon, h("span", { class: "lbl" }, label)));
  }
  // regla
  const ruler = h("div", { class: "ruler" });
  const step = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].find(x => T / x <= 8) || 3600;
  for (let x = 0; x <= T; x += step) ruler.append(h("span", { style: `left:${x / T * 100}%` }, x >= 60 ? Math.round(x / 60) + "m" : x + "s"));
  tl.append(ruler, h("div", { class: "head", id: "head" }), h("div", { class: "hover", id: "hov" }));

  const pos = e => { const r = tl.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * total(); };
  tl.onclick = e => seekSession(pos(e));
  tl.onmousemove = e => { const x = $("#hov"); x.style.display = "block"; x.style.left = (pos(e) / total() * 100) + "%"; x.textContent = fmt(pos(e)); };
  tl.onmouseleave = () => { $("#hov").style.display = "none"; };
  updateHead();
}
let lastT = 0;
function buildTimelineOnce() { const T = total(); if (Math.abs(T - lastT) > 1) { lastT = T; buildTimeline(); markActive(); } }

function updateHead() {
  if (!tl) return;
  const T = total(), t = sessionTime();
  const head = $("#head"), played = $("#played");
  if (head) head.style.left = (t / T * 100) + "%";
  if (played) played.style.width = st.playing ? "0" : (t / T * 100) + "%";
  const tt = $("#tltime");
  if (tt) tt.textContent = `${fmt(t)} / ${fmt(T)}`;
}

// ------------------------------------------------------------- extras
let toastTimer;
function toast(t) {
  const el = $("#toast"); if (!el) return;
  el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1400 + t.length * 40);
}
function showMsg(t) {
  const el = $("#msg"); if (!el) return;
  el.textContent = t; el.classList.toggle("show", !!t);
}
// ------------------------------------------------------------- pistas de audio
function keepList() {
  const n = tracksOf(st.sel).length;
  return [...Array(n).keys()].slice(1).filter(k => !st.muted.has(k));
}
function currentRel() { return st.playing ? st.playing.file : st.sel.match; }

function renderTracks() {
  const box = $("#tracks");
  if (!box) return;
  box.innerHTML = "";
  const names = tracksOf(st.sel);
  if (names.length <= 1) { box.style.display = "none"; return; }
  box.style.display = "";
  box.append("Pistas de audio:");
  names.forEach((n, k) => {
    if (k === 0) return; // la 0 es la mezcla completa
    const on = !st.muted.has(k);
    box.append(h("button", {
      class: "trk " + (on ? "on" : "off"), disabled: (!API || st.busy) ? "" : false,
      title: API ? (on ? "Silenciar " : "Activar ") + n : "Abre el reproductor desde ClipLite para silenciar pistas",
      onclick: () => toggleTrack(k),
    }, h("span", { class: "box" }, on ? "✓" : ""), TRACK_ICON(n) + " " + n));
  });
  if (st.busy) box.append(h("span", { class: "spin" }), h("span", { class: "note" }, "Preparando audio…"));
  else if (st.muted.size) box.append(h("span", { class: "note" }, "Se oyen solo las pistas marcadas"));
  box.append(h("div", { class: "grow" }));
  if (API && st.muted.size) box.append(h("button", { class: "chip", disabled: st.busy ? "" : false, onclick: saveCopy, title: "Guardar un vídeo nuevo con este audio, junto al original" }, "Guardar copia con este audio"));
}

function toggleTrack(k) {
  if (!API || st.busy) return;
  st.muted.has(k) ? st.muted.delete(k) : st.muted.add(k);
  const t = video.currentTime, playing = !video.paused;
  renderTracks();
  load(currentRel(), t, playing);
}

async function saveCopy() {
  const names = tracksOf(st.sel);
  const suffix = "sin-" + [...st.muted].sort().map(k => names[k]).join("-");
  st.busy = true; renderTracks();
  try {
    const r = await api("export", { file: currentRel(), keep: keepList().join(","), suffix });
    if (r.error) throw new Error(r.error);
    toast("Guardado: " + r.name);
  } catch (e) { toast("No se pudo guardar la copia"); }
  st.busy = false; renderTracks();
}

function reveal() {
  const rel = currentRel() || (st.sel.clips[0] || {}).file;
  if (rel) api("reveal", { file: rel }).catch(() => {});
}

function copyPath() {
  const rel = st.playing ? st.playing.file : st.sel.match || (st.sel.clips[0] || {}).file;
  if (!rel) return;
  let p = decodeURIComponent(new URL(src(rel), location.href).pathname);
  if (/^\/[A-Za-z]:\//.test(p)) p = p.slice(1).replace(/\//g, "\\");
  const done = () => toast("Ruta copiada");
  (navigator.clipboard ? navigator.clipboard.writeText(p).then(done) : Promise.reject()).catch(() => { prompt("Ruta del vídeo:", p); });
}

document.addEventListener("keydown", e => {
  if (st.view === "edit") return editorKey(e);
  if (!video || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  const fr = 1 / 60;
  if (k === " " || k === "k") { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if (k === "arrowright" && e.target !== video) { e.preventDefault(); video.currentTime += 5; }
  else if (k === "arrowleft" && e.target !== video) { e.preventDefault(); video.currentTime -= 5; }
  else if (k === "l") video.currentTime += 10;
  else if (k === "j") video.currentTime -= 10;
  else if (k === ".") { video.pause(); video.currentTime += fr; }
  else if (k === ",") { video.pause(); video.currentTime -= fr; }
  else if (k === "n") jumpEvent(1);
  else if (k === "p") jumpEvent(-1);
  else if (k === "m") video.muted = !video.muted;
  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : video.requestFullscreen().catch(() => {}); }
});

$("#navAll").onclick = () => { st.view = "all"; if (!st.sel) pickFirst(); render(); };
$("#navEdit").onclick = () => openEditor(false);
$("#navSpace").onclick = () => { st.view = "space"; if (video) video.pause(); render(); };
$("#navFav").onclick = () => { st.view = "fav"; if (video) video.pause(); render(); };

// ============================================================= EDITOR
// Proyecto: lista de trozos (archivo + inicio/fin + velocidad + texto) y ajustes de salida.
// La vista previa reproduce los trozos seguidos en el navegador; "Exportar" lo envía a ClipLite,
// que lo codifica con la GPU. Los originales nunca se modifican.
const ED_KEY = "cliplite.editor";
const SPEEDS = [0.25, 0.5, 0.75, 1, 1.5, 2];
const FORMATS = [["original", "Original 16:9"], ["vertical", "Vertical 9:16"], ["vertical_blur", "Vertical con fondo"], ["square", "Cuadrado 1:1"]];
const QUALITIES = [["alta", "Alta"], ["720p", "720p"], ["discord", "Discord (< 10 MB)"]];
let proj = null, edv = null, edbg = null, edSel = 0, edCur = 0, edPlaying = false, edJob = null, edSeq = 0;
const edMixCache = {};
let segId = 1;

function newProject() {
  return { name: "", session: "", game: "", format: "original", focus: 0.5, fps: 60, quality: "alta", fade: true, muted: [], width: 1920, height: 1080, segments: [] };
}
function edLoad() {
  try { const p = JSON.parse(localStorage.getItem(ED_KEY) || "null"); if (p && Array.isArray(p.segments)) { p.segments.forEach(g => g.id = segId++); return p; } } catch (e) {}
  return newProject();
}
function edSave() { try { localStorage.setItem(ED_KEY, JSON.stringify(proj)); } catch (e) {} }
const segDur = g => Math.max(0, g.out - g.in) / g.speed;
const projDur = () => proj.segments.reduce((a, g) => a + segDur(g), 0);
const segStart = i => proj.segments.slice(0, i).reduce((a, g) => a + segDur(g), 0);
const sessionOfFile = f => sessions.find(s => s.match === f || s.clips.some(c => c.file === f));

/** Crea un trozo desde un clip o desde la partida completa (alrededor de `around`, en segundos). */
function makeSeg(s, c, around) {
  if (c) return { id: segId++, file: c.file, label: ev(c.label)[0], in: 0, out: c.dur, srcDur: c.dur, speed: 1, text: "", text_pos: "top", tracks: s.tracks || [] };
  const D = s.duration || 30;
  const a = around == null ? 0 : Math.max(0, around - 15);
  return { id: segId++, file: s.match, label: "Partida", in: a, out: Math.min(D, a + 30), srcDur: D, speed: 1, text: "", text_pos: "top", tracks: s.tracks || [] };
}

function addSeg(s, c, around) {
  if (!proj.segments.length) { proj.session = s.id; proj.game = s.game; if (!proj.name) proj.name = `${s.game} ${c ? ev(c.label)[0] : "partida"} editado`; }
  proj.segments.push(makeSeg(s, c, around));
  edSel = proj.segments.length - 1;
  edSave();
}

/** Abrir el editor con lo que se está viendo en el reproductor. */
function openEditor(fromPlayer) {
  if (!proj) proj = edLoad();
  if (fromPlayer && st.sel) {
    const s = st.sel, c = st.playing, t = !c && video ? video.currentTime : null;
    if (proj.segments.length && !confirm("Ya tienes un proyecto en el editor.\n\nAceptar = añadir este vídeo al proyecto\nCancelar = empezar un proyecto nuevo")) {
      proj = newProject();
    }
    addSeg(s, c, t);
  }
  if (video) video.pause();
  st.view = "edit";
  render();
}

// ------------------------------------------------------------- vista
function renderEditor(main) {
  if (!proj) proj = edLoad();
  edSel = Math.min(edSel, Math.max(0, proj.segments.length - 1));
  main.append(h("header", {},
    h("div", { class: "crumbs" }, h("span", {}, "Editor")),
    h("input", { class: "edname", placeholder: "Nombre del vídeo", value: proj.name, oninput: e => { proj.name = e.target.value; edSave(); } }),
    h("div", { class: "grow" }),
    h("button", { class: "chip", onclick: () => { if (proj.segments.length && !confirm("¿Empezar un proyecto nuevo? Se quitarán los trozos actuales (los vídeos no se borran).")) return; proj = newProject(); edSave(); render(); } }, "Nuevo proyecto")));

  const wrap = h("section", { class: "ed" });
  const left = h("div", { class: "edleft" }), right = h("div", { class: "edright" });
  wrap.append(left, right);
  main.append(wrap);

  // vista previa
  const frame = h("div", { class: "edframe", id: "edframe" });
  edbg = h("video", { class: "edbg", muted: "", preload: "auto" });
  edv = h("video", { class: "edv", preload: "auto" });
  edv.addEventListener("timeupdate", edTick);
  edv.addEventListener("loadedmetadata", edMeta);
  edv.addEventListener("play", () => { edbg.play().catch(() => {}); });
  edv.addEventListener("pause", () => edbg.pause());
  edv.addEventListener("seeked", () => { if (Math.abs(edbg.currentTime - edv.currentTime) > 0.15) edbg.currentTime = edv.currentTime; });
  frame.append(edbg, edv, h("div", { class: "edtext", id: "edtext" }));
  left.append(h("div", { class: "edstage" }, frame, h("div", { class: "toast", id: "toast" })));

  if (!proj.segments.length) {
    frame.append(h("div", { class: "edempty" }, h("div", {}, h("b", {}, "Proyecto vacío"), h("br"), "Añade clips o trozos de una partida desde la derecha, o pulsa “✂ Editar” mientras ves un vídeo.")));
  }

  // transporte
  left.append(h("div", { class: "edtrans" },
    h("button", { class: "chip", id: "edplay", onclick: edToggle, disabled: proj.segments.length ? false : "" }, "▶ Reproducir"),
    h("span", { id: "edtime", class: "edtime" }, `0:00 / ${fmt(projDur())}`),
    h("div", { class: "grow" }),
    h("span", { class: "note" }, h("kbd", {}, "Espacio"), " reproducir · ", h("kbd", {}, "I"), h("kbd", {}, "O"), " inicio/fin · ", h("kbd", {}, "S"), " partir · ", h("kbd", {}, "Supr"), " quitar")));

  // línea de tiempo del proyecto
  const tl = h("div", { class: "edtl", id: "edtl" });
  const T = projDur() || 1;
  proj.segments.forEach((g, i) => {
    tl.append(h("button", { class: "edseg" + (i === edSel ? " on" : ""), style: `flex:${Math.max(segDur(g), T * 0.04)}`, onclick: () => { edSel = i; edSeekProj(segStart(i), false); edRenderPanel(); edMarkSel(); } },
      h("span", { class: "nm" }, `${i + 1}. ${g.label}`), h("span", { class: "dd" }, fmt(segDur(g)) + (g.speed !== 1 ? ` · ${g.speed}×` : "") + (g.text ? " · T" : ""))));
  });
  tl.append(h("div", { class: "edhead", id: "edhead" }));
  left.append(tl);
  left.append(h("div", { class: "edpanel", id: "edpanel" }));

  // panel derecho
  right.append(edSourcesPanel(), edOutputPanel());

  edFrameShape();
  edRenderPanel();
  if (proj.segments.length) edSeekProj(edCur = Math.min(edCur, projDur()), false);
}

function edMarkSel() {
  document.querySelectorAll(".edseg").forEach((b, i) => b.classList.toggle("on", i === edSel));
}

function edSourcesPanel() {
  const box = h("div", { class: "panel" }, h("h3", {}, "Añadir trozos"));
  const sel = h("select", { onchange: () => fill() }, sessions.map(s => h("option", { value: s.id, selected: s.id === (proj.session || (st.sel && st.sel.id)) ? "" : false }, `${s.game} · ${fdate(s.date)}`)));
  const list = h("div", { class: "edsrc" });
  const fill = () => {
    const s = sessions.find(x => x.id === sel.value) || sessions[0];
    list.innerHTML = "";
    if (!s) return;
    const row = (label, sub, fn) => list.append(h("button", { class: "edsrcrow", onclick: fn }, h("span", {}, label), h("span", { class: "g" }, sub), h("b", {}, "+")));
    if (s.match) row("Partida completa", fmt(s.duration), () => { addSeg(s, null, 15); render(); });
    for (const c of s.clips) row(ev(c.label)[0], fmt(c.dur), () => { addSeg(s, c); render(); });
  };
  fill();
  box.append(sel, list);
  return box;
}

function edOutputPanel() {
  const box = h("div", { class: "panel" }, h("h3", {}, "Salida"));
  // formato
  box.append(h("div", { class: "edlbl" }, "Formato"),
    h("div", { class: "edchips" }, FORMATS.map(([k, n]) => h("button", { class: "chip" + (proj.format === k ? " on" : ""), onclick: () => { proj.format = k; edSave(); render(); } }, n))));
  if (proj.format !== "original" && proj.format !== "vertical_blur") {
    box.append(h("div", { class: "edlbl" }, "Encuadre (qué parte de la pantalla se ve)"),
      h("input", { type: "range", min: 0, max: 1, step: 0.01, value: proj.focus, style: "width:100%", oninput: e => { proj.focus = +e.target.value; edSave(); edFrameShape(); } }));
  }
  // audio
  const names = [...new Set(proj.segments.flatMap(g => (g.tracks || []).slice(1)))];
  if (names.length) {
    box.append(h("div", { class: "edlbl" }, "Pistas de audio"),
      h("div", { class: "edchips" }, names.map(n => {
        const on = !proj.muted.includes(n);
        return h("button", { class: "trk " + (on ? "on" : "off"), onclick: () => {
          proj.muted = on ? [...proj.muted, n] : proj.muted.filter(x => x !== n); edSave(); render(); } },
          h("span", { class: "box" }, on ? "✓" : ""), TRACK_ICON(n) + " " + n);
      })));
  }
  // opciones
  box.append(h("div", { class: "edrow" },
    h("label", {}, h("input", { type: "checkbox", checked: proj.fade ? "" : false, onchange: e => { proj.fade = e.target.checked; edSave(); } }), " Fundido al inicio y al final"),
    h("select", { onchange: e => { proj.fps = +e.target.value; edSave(); } }, [60, 30].map(f => h("option", { value: f, selected: proj.fps === f ? "" : false }, f + " fps")))));
  box.append(h("div", { class: "edlbl" }, "Calidad"),
    h("div", { class: "edchips" }, QUALITIES.map(([k, n]) => h("button", { class: "chip" + (proj.quality === k ? " on" : ""), onclick: () => { proj.quality = k; edSave(); render(); } }, n))));
  const T = projDur();
  const est = proj.quality === "discord" ? "menos de 10 MB" : "≈ " + human(((proj.quality === "720p" ? 6 : 20) * 1e6 + 128e3) * T / 8);
  box.append(h("p", {}, `Duración: ${fmt(T)} · Tamaño: ${est}`));
  // exportar
  const exp = h("div", { id: "edexport" });
  box.append(exp);
  edRenderExport(exp);
  return box;
}

function edRenderExport(box) {
  box = box || $("#edexport");
  if (!box) return;
  box.innerHTML = "";
  if (!API) { box.append(h("p", {}, "Abre el reproductor desde ClipLite (doble clic en su icono) para poder exportar.")); return; }
  if (edJob && edJob.state === "running") {
    box.append(h("div", { class: "bar" }, h("i", { style: `width:${Math.round((edJob.progress || 0) * 100)}%` })),
      h("div", { class: "edrow" }, h("span", {}, `Exportando… ${Math.round((edJob.progress || 0) * 100)} %`),
        h("button", { class: "chip", onclick: () => api("edit_cancel", { id: edJob.id }) }, "Cancelar")));
    return;
  }
  if (edJob && edJob.state === "done") {
    box.append(h("p", { class: "ok" }, `✓ Guardado: ${edJob.name} (${edJob.size})`),
      h("div", { class: "edrow" },
        h("button", { class: "chip", onclick: () => { location.hash = "#s=" + encodeURIComponent(proj.session || ""); location.reload(); } }, "Ver en la biblioteca"),
        h("button", { class: "chip", onclick: () => api("reveal", { file: edJob.file }) }, "Mostrar en carpeta")));
  } else if (edJob && edJob.state === "failed") {
    box.append(h("p", { class: "err" }, "No se pudo exportar. Mira el registro (log.txt) para más detalles."));
  } else if (edJob && edJob.state === "cancelled") {
    box.append(h("p", {}, "Exportación cancelada."));
  }
  box.append(h("button", { class: "chip primary", disabled: proj.segments.length ? false : "", onclick: edExport }, "⬇ Exportar vídeo"));
}

async function edExport() {
  if (!proj.segments.length) return;
  edPause();
  const body = JSON.stringify({ ...proj, segments: proj.segments.map(g => ({ file: g.file, in: g.in, out: g.out, speed: g.speed, text: g.text, text_pos: g.text_pos, tracks: g.tracks })) });
  try {
    const r = await (await fetch(`/api/edit?t=${API}`, { method: "POST", headers: { "Content-Type": "application/json" }, body })).json();
    if (r.error) { toast(r.error); return; }
    edJob = { id: r.id, state: "running", progress: 0 };
    edRenderExport();
    const poll = async () => {
      const s = await api("edit_status", { id: edJob.id });
      edJob = { ...edJob, ...s };
      edRenderExport();
      if (s.state === "running") setTimeout(poll, 500);
    };
    setTimeout(poll, 300);
  } catch (e) { toast("No se pudo exportar"); }
}

// ------------------------------------------------------------- panel del trozo seleccionado
function edRenderPanel() {
  const box = $("#edpanel");
  if (!box) return;
  box.innerHTML = "";
  const g = proj.segments[edSel];
  if (!g) return;
  const bar = h("div", { class: "edrange", id: "edrange" });
  const pct = x => (x / (g.srcDur || g.out || 1) * 100) + "%";
  const sel = h("div", { class: "edsel", style: `left:${pct(g.in)};width:calc(${pct(g.out)} - ${pct(g.in)})` });
  const hin = h("div", { class: "edh", style: `left:${pct(g.in)}`, title: "Arrastra para cambiar el inicio" });
  const hout = h("div", { class: "edh", style: `left:${pct(g.out)}`, title: "Arrastra para cambiar el final" });
  bar.append(sel, hin, hout, h("div", { class: "edsrchead", id: "edsrchead" }));
  const timeAt = e => { const r = bar.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (g.srcDur || g.out); };
  const drag = which => e => {
    e.preventDefault(); e.stopPropagation();
    edPause();
    const move = ev2 => {
      const t = timeAt(ev2);
      if (which === "in") g.in = Math.min(t, g.out - 0.2); else g.out = Math.max(t, g.in + 0.2);
      sel.style.left = pct(g.in); sel.style.width = `calc(${pct(g.out)} - ${pct(g.in)})`;
      hin.style.left = pct(g.in); hout.style.left = pct(g.out);
      $("#edinout").textContent = `${fmtp(g.in)} → ${fmtp(g.out)} (${fmtp(g.out - g.in)})`;
      edShowSource(edSel, which === "in" ? g.in : g.out);
    };
    const up = () => { removeEventListener("pointermove", move); removeEventListener("pointerup", up); edSave(); render(); };
    addEventListener("pointermove", move); addEventListener("pointerup", up);
  };
  hin.onpointerdown = drag("in"); hout.onpointerdown = drag("out");
  bar.onclick = e => { edPause(); edShowSource(edSel, timeAt(e)); };

  const sp = h("select", { onchange: e => { g.speed = +e.target.value; edSave(); render(); } }, SPEEDS.map(v => h("option", { value: v, selected: g.speed === v ? "" : false }, v === 1 ? "Normal" : v + "×")));
  const pos = h("select", { onchange: e => { g.text_pos = e.target.value; edSave(); edUpdateText(); } }, [["top", "Arriba"], ["center", "Centro"], ["bottom", "Abajo"]].map(([k, n]) => h("option", { value: k, selected: g.text_pos === k ? "" : false }, n)));
  box.append(
    h("div", { class: "edrow" }, h("b", {}, `Trozo ${edSel + 1}: ${g.label}`), h("span", { class: "g", id: "edinout" }, `${fmtp(g.in)} → ${fmtp(g.out)} (${fmtp(g.out - g.in)})`), h("div", { class: "grow" }),
      h("button", { class: "chip", onclick: () => edMove(-1), disabled: edSel === 0 ? "" : false, title: "Mover antes" }, "◀"),
      h("button", { class: "chip", onclick: () => edMove(1), disabled: edSel === proj.segments.length - 1 ? "" : false, title: "Mover después" }, "▶"),
      h("button", { class: "chip", onclick: edDuplicate }, "Duplicar"),
      h("button", { class: "chip danger", onclick: edDelete }, "Quitar")),
    bar,
    h("div", { class: "edrow" },
      h("button", { class: "chip", onclick: () => edSetPoint("in") }, "[ Inicio aquí"),
      h("button", { class: "chip", onclick: () => edSetPoint("out") }, "Fin aquí ]"),
      h("button", { class: "chip", onclick: edSplit }, "✂ Partir aquí"),
      h("div", { class: "grow" }), "Velocidad", sp),
    h("div", { class: "edrow" }, "Texto",
      h("input", { class: "edtxt", maxlength: 120, placeholder: "Texto sobre este trozo (opcional)", value: g.text, oninput: e => { g.text = e.target.value; edSave(); edUpdateText(); } }), pos));
  edUpdateSourceHead();
}
const fmtp = s => { s = Math.max(0, s); const m = Math.floor(s / 60); return `${m}:${(s % 60).toFixed(1).padStart(4, "0")}`; };

// ------------------------------------------------------------- edición
function edMove(d) {
  const i = edSel, j = i + d, a = proj.segments;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; edSel = j; edSave(); render();
}
function edDuplicate() { const g = proj.segments[edSel]; proj.segments.splice(edSel + 1, 0, { ...g, id: segId++ }); edSel++; edSave(); render(); }
function edDelete() { proj.segments.splice(edSel, 1); edSel = Math.max(0, edSel - 1); edCur = 0; edSave(); render(); }
/** Tiempo actual dentro del vídeo original del trozo seleccionado. */
function edSourceTime() {
  const g = proj.segments[edSel];
  if (!g || !edv) return null;
  return edv.dataset.seg == String(g.id) ? edv.currentTime : g.in;
}
function edSetPoint(which) {
  const g = proj.segments[edSel], t = edSourceTime();
  if (!g || t == null) return;
  if (which === "in") { if (t >= g.out - 0.2) return toast("El inicio debe ir antes del final"); g.in = t; }
  else { if (t <= g.in + 0.2) return toast("El final debe ir después del inicio"); g.out = t; }
  edSave(); render(); toast(which === "in" ? "Inicio marcado" : "Final marcado");
}
function edSplit() {
  const g = proj.segments[edSel], t = edSourceTime();
  if (!g || t == null) return;
  if (t <= g.in + 0.2 || t >= g.out - 0.2) return toast("Coloca la reproducción dentro del trozo para partirlo");
  const b = { ...g, id: segId++, in: t };
  g.out = t;
  proj.segments.splice(edSel + 1, 0, b);
  edSave(); render(); toast("Trozo partido en dos");
}

// ------------------------------------------------------------- vista previa
function edFrameShape() {
  const f = $("#edframe");
  if (!f) return;
  const ar = { original: `${proj.width}/${proj.height}`, vertical: "9/16", vertical_blur: "9/16", square: "1/1" }[proj.format];
  f.style.aspectRatio = ar;
  const cover = proj.format === "vertical" || proj.format === "square";
  edv.style.objectFit = cover ? "cover" : "contain";
  edv.style.objectPosition = `${proj.focus * 100}% 50%`;
  edbg.style.display = proj.format === "vertical_blur" ? "" : "none";
}
function edUpdateText() {
  const el = $("#edtext"), g = proj.segments[edSel];
  if (!el) return;
  const t = g ? g.text.trim() : "";
  el.textContent = t;
  el.style.display = t ? "" : "none";
  el.className = "edtext " + (g ? g.text_pos : "top");
  const f = $("#edframe");
  if (f && t) el.style.fontSize = Math.min(f.clientHeight * 0.055, f.clientWidth * 1.55 / t.length) + "px";
}
async function edSrcUrl(g) {
  if (!proj.muted.length || !API) return src(g.file);
  const names = g.tracks || [];
  const keep = names.map((n, k) => k).filter(k => k > 0 && !proj.muted.includes(names[k]));
  const key = g.file + "|" + keep.join(",");
  if (!edMixCache[key]) {
    try { const r = await api("mix", { file: g.file, keep: keep.join(",") }); edMixCache[key] = r.url || src(g.file); }
    catch (e) { edMixCache[key] = src(g.file); }
  }
  return edMixCache[key];
}
/** Muestra el trozo i en el instante t de su vídeo original. */
async function edShowSource(i, t, play) {
  const g = proj.segments[i];
  if (!g || !edv) return;
  const seq = ++edSeq;
  const url = await edSrcUrl(g);
  if (seq !== edSeq) return;
  if (edv.dataset.seg !== String(g.id) || edv.getAttribute("src") !== url) {
    edv.dataset.seg = String(g.id);
    edv.dataset.idx = i;
    if (edv.getAttribute("src") !== url) {
      edv.setAttribute("src", url);
      edbg.setAttribute("src", url);
      await new Promise(r => edv.addEventListener("loadedmetadata", r, { once: true }));
      if (seq !== edSeq) return;
    }
  }
  edv.dataset.idx = i;
  edv.playbackRate = g.speed;
  edv.currentTime = t;
  edbg.currentTime = t;
  if (play) edv.play().catch(() => {});
  if (i !== edSel) { edSel = i; edRenderPanel(); edMarkSel(); }
  edUpdateText();
}
function edSeekProj(T, play) {
  let acc = 0;
  for (let i = 0; i < proj.segments.length; i++) {
    const d = segDur(proj.segments[i]);
    if (T < acc + d || i === proj.segments.length - 1) {
      const g = proj.segments[i];
      edShowSource(i, g.in + Math.max(0, Math.min(T - acc, d)) * g.speed, play);
      return;
    }
    acc += d;
  }
}
function edToggle() { edPlaying ? edPause() : edPlay(); }
function edPlay() {
  if (!proj.segments.length) return;
  edPlaying = true;
  const b = $("#edplay"); if (b) b.textContent = "❚❚ Pausa";
  let T = edProjTime();
  if (T >= projDur() - 0.05) T = 0;
  edSeekProj(T, true);
}
function edPause() {
  edPlaying = false;
  if (edv) edv.pause();
  const b = $("#edplay"); if (b) b.textContent = "▶ Reproducir";
}
/** Posición en el proyecto según lo que muestra el vídeo. */
function edProjTime() {
  const i = +(edv && edv.dataset.idx || 0), g = proj.segments[i];
  if (!g) return 0;
  return segStart(i) + Math.max(0, Math.min(edv.currentTime - g.in, g.out - g.in)) / g.speed;
}
function edTick() {
  const i = +(edv.dataset.idx || 0), g = proj.segments[i];
  if (!g) return;
  if (edPlaying && edv.currentTime >= g.out - 0.02) {
    if (i + 1 < proj.segments.length) edShowSource(i + 1, proj.segments[i + 1].in, true);
    else { edPause(); edv.currentTime = g.out; }
  }
  if (Math.abs(edbg.currentTime - edv.currentTime) > 0.3) edbg.currentTime = edv.currentTime;
  edCur = edProjTime();
  const T = projDur() || 1;
  const head = $("#edhead"); if (head) head.style.left = (edCur / T * 100) + "%";
  const tt = $("#edtime"); if (tt) tt.textContent = `${fmtp(edCur)} / ${fmtp(projDur())}`;
  edUpdateSourceHead();
}
function edUpdateSourceHead() {
  const g = proj.segments[edSel], hd = $("#edsrchead");
  if (!g || !hd || !edv) return;
  const t = edv.dataset.seg == String(g.id) ? edv.currentTime : g.in;
  hd.style.left = (t / (g.srcDur || g.out || 1) * 100) + "%";
}
function edMeta() {
  // Duración real del vídeo original y tamaño (para el formato "Original").
  const i = +(edv.dataset.idx || 0), g = proj.segments[i];
  if (!g || !isFinite(edv.duration)) return;
  let changed = false;
  for (const x of proj.segments) if (x.file === g.file && Math.abs((x.srcDur || 0) - edv.duration) > 0.05) { x.srcDur = edv.duration; x.out = Math.min(x.out, edv.duration); changed = true; }
  if (i === 0 && edv.videoWidth && (proj.width !== edv.videoWidth || proj.height !== edv.videoHeight)) {
    proj.width = edv.videoWidth; proj.height = edv.videoHeight; changed = true; edFrameShape();
  }
  if (changed) { edSave(); edRenderPanel(); }
}

function editorKey(e) {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); edToggle(); }
  else if (k === "i") edSetPoint("in");
  else if (k === "o") edSetPoint("out");
  else if (k === "s") edSplit();
  else if (k === "delete" || k === "backspace") { if (proj.segments.length) edDelete(); }
  else if (k === "arrowright") { e.preventDefault(); edPause(); edSeekProj(Math.min(projDur(), edProjTime() + 1)); }
  else if (k === "arrowleft") { e.preventDefault(); edPause(); edSeekProj(Math.max(0, edProjTime() - 1)); }
  else if (k === ".") { edPause(); edv.currentTime += 1 / 60; }
  else if (k === ",") { edPause(); edv.currentTime -= 1 / 60; }
}

// Favoritos: la biblioteca es la fuente (así la limpieza automática los respeta). Los marcados
// antes solo en este navegador se envían una vez a ClipLite.
for (const s of sessions) for (const c of s.clips) if (c.fav) favs.add(c.file);
if (API) {
  for (const s of sessions) for (const c of s.clips) if (favs.has(c.file) && !c.fav) api("fav", { file: c.file, on: 1 }).catch(() => {});
}
saveFavs();

// sesión pedida en la URL (#s=...) o la más reciente; vista (#v=espacio)
if (/v=espacio/.test(location.hash)) st.view = "space";
if (/v=editor/.test(location.hash)) st.view = "edit";
const want = decodeURIComponent((location.hash.match(/s=([^&]+)/) || [])[1] || "");
st.sel = sessions.find(s => s.id === want) || sessions[0] || null;
render();
</script>
